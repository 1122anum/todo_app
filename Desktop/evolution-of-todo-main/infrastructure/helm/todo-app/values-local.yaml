# Local development values for Minikube
# Override default values for local development environment

# Global configuration
global:
  namespace: todo-app
  imageRegistry: ""  # Use local Docker images
  imagePullPolicy: Never  # Don't pull from registry, use local images
  storageClass: standard

# Dapr configuration
dapr:
  enabled: true
  appPort: 8000
  logLevel: debug  # More verbose logging for development
  enableMetrics: true
  metricsPort: 9090

# Frontend Service
frontend:
  enabled: true
  replicaCount: 1  # Single replica for local dev
  image:
    repository: todo-frontend
    tag: latest
  service:
    type: NodePort  # NodePort for easy local access
    port: 3000
    nodePort: 30000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  env:
    - name: NODE_ENV
      value: "development"
    - name: NEXT_PUBLIC_API_URL
      value: "http://localhost:30001"

# Chat API Service
chatApi:
  enabled: true
  replicaCount: 1
  image:
    repository: todo-chat-api
    tag: latest
  service:
    type: NodePort
    port: 8000
    nodePort: 30001
  dapr:
    enabled: true
    appId: chat-api
    appPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    - name: ENVIRONMENT
      value: "development"
    - name: LOG_LEVEL
      value: "debug"

# Todo API Service
todoApi:
  enabled: true
  replicaCount: 1
  image:
    repository: todo-api
    tag: latest
  service:
    type: NodePort
    port: 8000
    nodePort: 30002
  dapr:
    enabled: true
    appId: todo-api
    appPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  env:
    - name: ENVIRONMENT
      value: "development"
    - name: LOG_LEVEL
      value: "debug"

# Recurring Task Service
recurringTaskService:
  enabled: true
  replicaCount: 1
  image:
    repository: todo-recurring-service
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  dapr:
    enabled: true
    appId: recurring-task-service
    appPort: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  env:
    - name: ENVIRONMENT
      value: "development"
    - name: LOG_LEVEL
      value: "debug"
    - name: CRON_SCHEDULE
      value: "*/1 * * * *"

# Notification Service
notificationService:
  enabled: true
  replicaCount: 1
  image:
    repository: todo-notification-service
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  dapr:
    enabled: true
    appId: notification-service
    appPort: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  env:
    - name: ENVIRONMENT
      value: "development"
    - name: LOG_LEVEL
      value: "debug"
    - name: CRON_SCHEDULE
      value: "*/1 * * * *"

# Audit Log Service
auditLogService:
  enabled: true
  replicaCount: 1
  image:
    repository: todo-audit-service
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  dapr:
    enabled: true
    appId: audit-log-service
    appPort: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  env:
    - name: ENVIRONMENT
      value: "development"
    - name: LOG_LEVEL
      value: "debug"

# WebSocket Sync Service
websocketSyncService:
  enabled: true
  replicaCount: 1
  image:
    repository: todo-websocket-service
    tag: latest
  service:
    type: NodePort
    port: 8003
    nodePort: 30003
  dapr:
    enabled: true
    appId: websocket-sync-service
    appPort: 8003
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  env:
    - name: ENVIRONMENT
      value: "development"
    - name: LOG_LEVEL
      value: "debug"

# Ingress configuration (disabled for local, using NodePort instead)
ingress:
  enabled: false

# Database configuration
database:
  secretName: db-connection
  connectionStringKey: connectionString

# Monitoring (simplified for local)
monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false

# Autoscaling (disabled for local)
autoscaling:
  enabled: false

# Pod disruption budget (disabled for local)
podDisruptionBudget:
  enabled: false

# Security context (relaxed for local dev)
securityContext:
  runAsNonRoot: false
  runAsUser: 1000
  fsGroup: 1000

# Network policies (disabled for local)
networkPolicy:
  enabled: false
