apiVersion: v1
kind: Secret
metadata:
  name: todo-chatbot-secrets
  labels:
    app: todo-chatbot
    component: secrets
type: Opaque
data:
  # IMPORTANT: All values must be base64 encoded
  # To encode: echo -n "your-value" | base64
  # To decode: echo "encoded-value" | base64 -d

  # Database connection (Neon Serverless PostgreSQL)
  # Example: postgresql://user:password@host:5432/database
  DATABASE_URL: cG9zdGdyZXNxbDovL3VzZXI6cGFzc3dvcmRAaG9zdDo1NDMyL2RhdGFiYXNl

  # OpenRouter API Key
  # Get from: https://openrouter.ai/keys
  OPENROUTER_API_KEY: c2stb3ItdjEteW91ci1hcGkta2V5LWhlcmU=

  # JWT Secret for authentication
  # Generate: openssl rand -base64 32
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0LWhlcmUtMzItYnl0ZXM=

  # Auth Secret for Better Auth
  # Generate: openssl rand -base64 32
  AUTH_SECRET: eW91ci1hdXRoLXNlY3JldC1oZXJlLTMyLWJ5dGVz

---
# Instructions for updating secrets:
#
# 1. Get your actual values:
#    - DATABASE_URL from Neon dashboard
#    - OPENROUTER_API_KEY from OpenRouter dashboard
#    - Generate JWT_SECRET: openssl rand -base64 32
#    - Generate AUTH_SECRET: openssl rand -base64 32
#
# 2. Base64 encode each value:
#    echo -n "your-actual-value" | base64
#
# 3. Replace the placeholder values above with your encoded values
#
# 4. Apply to cluster:
#    kubectl apply -f infrastructure/kubernetes/base/secrets.yaml
#
# 5. Verify (values will be hidden):
#    kubectl get secret todo-chatbot-secrets
#    kubectl describe secret todo-chatbot-secrets
#
# Security Notes:
# - Never commit actual secrets to version control
# - Use .gitignore to exclude secrets.yaml if it contains real values
# - Consider using external secret management (Sealed Secrets, External Secrets Operator)
# - Rotate secrets regularly
