apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  labels:
    app: todo-backend
    tier: backend
    component: api
spec:
  type: ClusterIP
  selector:
    app: todo-backend
    tier: backend
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  sessionAffinity: None
